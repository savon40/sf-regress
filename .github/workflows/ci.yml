name: ci

# Build, lint and unit-test on every push and pull request.
# No org or Anthropic key needed: the unit tests use a mock org and a scripted model.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install Chromium for the browser step tests
        run: npx playwright install --with-deps chromium
      - run: yarn build
      - run: yarn test
